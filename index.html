<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INKventory</title>
  <meta name="description" content="보유 잉크와 만년필을 기록하는 개인 인벤토리">
  <meta name="theme-color" content="#eff1f6">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- 폰트 로딩 최적화: 연결 선확보 + 다이내믹 서브셋(쓰는 글자 조각만 다운로드) + font-display: swap -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.css">

  <!-- 파일 주소 끝의 ?v= 숫자: css/js 를 고칠 때마다 함께 올린다. (index.html 과 css/js 가 서로 다른 시점의 것으로 섞여 앱이 멈추는 일을 막음) -->
  <link rel="stylesheet" href="css/style.css?v=20261113d">

  <!-- 화면 배치: 이 탭에서 관리자로 로그인한 적이 있으면 관리자 배치로 시작(첫 화면 깜빡임 방지). 아니면 일반 배치. -->
  <script>
    try { document.documentElement.dataset.layout = sessionStorage.getItem('inkventory.signedin') ? 'admin' : 'normal'; }
    catch (e) { document.documentElement.dataset.layout = 'normal'; }
  </script>

  <!-- 데이터 로딩 최적화: 보유 잉크 화면으로 바로 들어오면(새로고침 등) 다른 스크립트가 준비되기 전에 데이터 요청부터 시작 -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <script src="js/config.js?v=20261113d"></script>
  <script>
    try {
      var fbc = window.INKVENTORY_CONFIG && window.INKVENTORY_CONFIG.firebase;
      if (fbc && fbc.apiKey && location.hash === '#/ink-owned') {
        window.__inkDoc = fetch('https://firestore.googleapis.com/v1/projects/' + fbc.projectId +
          '/databases/(default)/documents/inventory/inkOwned?key=' + fbc.apiKey)
          .then(function (r) { return r.status === 404 ? null : (r.ok ? r.json() : Promise.reject(new Error('http ' + r.status))); });
        window.__inkDoc.catch(function () {});
      }
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar" aria-label="사이드바">
    <div class="sidebar__head">
      <div class="sidebar__title">
        <button class="icon-btn" id="sidebarCollapse" type="button" aria-label="사이드바 닫기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <a class="brand" href="#/" aria-label="INKventory 홈">INK<span>ventory</span></a>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="카테고리"></nav>
    <div class="stats" id="inkStats" role="group" aria-label="보유 잉크 개수">
      <div class="stat stat--total"><span class="stat__label">잉크 개수</span><b class="stat__num" data-k="total">–</b></div>
      <div class="stat"><span class="stat__label"><i class="stat__dot stat__dot--bottle" aria-hidden="true"></i>본병</span><b class="stat__num" data-k="bottle">–</b></div>
      <div class="stat"><span class="stat__label"><i class="stat__dot stat__dot--sample" aria-hidden="true"></i>소분</span><b class="stat__num" data-k="sample">–</b></div>
      <div class="stat"><span class="stat__label"><i class="stat__dot stat__dot--standard" aria-hidden="true"></i>스탠다드</span><b class="stat__num" data-k="standard">–</b></div>
      <div class="stat"><span class="stat__label"><i class="stat__dot stat__dot--pearl" aria-hidden="true"></i>펄</span><b class="stat__num" data-k="pearl">–</b></div>
    </div>
    <div class="sidebar__foot">
      <div class="foot__id">
        <button class="id-btn" id="idBtn" type="button" aria-haspopup="dialog">明 @wishupona__</button><span class="mode-tag" id="modeTag" hidden> | 관리자 모드</span>
      </div>
      <button class="foot__logout" id="logoutBtn" type="button" title="로그아웃" aria-label="로그아웃" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        </svg>
      </button>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button class="icon-btn" id="sidebarToggle" type="button"
              aria-controls="sidebar" aria-expanded="false" aria-label="사이드바 열기/닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
      <span class="topbar__title" id="pageTitle">HOME</span>
      <span class="save-status" id="saveStatus" role="status" aria-live="polite" hidden></span>
    </header>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <dialog class="dialog" id="authDialog" aria-labelledby="authTitle">
    <div class="dialog__body">
      <h2 class="dialog__title" id="authTitle">관리자 모드</h2>
      <p class="dialog__desc">관리자(明 @wishupona__) 외에는 접근이 불가능합니다.</p>
      <p class="dialog__error" id="authError" role="alert" hidden></p>
      <div class="dialog__actions">
        <button class="btn" type="button" data-close>CANCEL</button>
        <button class="btn btn--primary" type="button" id="googleBtn">LOGIN</button>
      </div>
    </div>
  </dialog>

  <script src="js/fb.js?v=20261113d"></script>
  <script src="js/views/ink-owned.js?v=20261113d"></script>
  <script src="js/views/ink-export.js?v=20261113d"></script>
  <script src="js/views/ink-notice.js?v=20261113d"></script>
  <script src="js/app.js?v=20261113d"></script>
</body>
</html>
