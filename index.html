<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INKventory</title>
  <meta name="description" content="보유 잉크와 만년필을 기록하는 개인 인벤토리">
  <meta name="theme-color" content="#f6f4ef">

  <!-- 폰트 로딩 최적화: 연결 선확보 + 다이내믹 서브셋(쓰는 글자 조각만 다운로드) + font-display: swap -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.css">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar" aria-label="사이드바">
    <div class="sidebar__head">
      <a class="brand" href="#/" aria-label="INKventory 홈">INK<span>ventory</span></a>
      <button class="icon-btn" id="sidebarClose" type="button" aria-label="사이드바 닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <nav class="nav" id="nav" aria-label="카테고리"></nav>
    <div class="sidebar__foot">
      <button class="id-btn" id="idBtn" type="button" aria-haspopup="dialog">@wishupona__</button><span class="mode-tag" id="modeTag" hidden> | 관리자 모드</span>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button class="icon-btn" id="sidebarToggle" type="button"
              aria-controls="sidebar" aria-expanded="false" aria-label="사이드바 열기/닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
      <span class="topbar__title" id="pageTitle">홈</span>
    </header>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <dialog class="dialog" id="authDialog" aria-labelledby="authTitle">
    <div class="dialog__body">
      <div id="loginPanel">
        <h2 class="dialog__title" id="authTitle">관리자 모드</h2>
        <p class="dialog__desc">관리자 구글 계정으로 로그인하면 관리자 모드로 전환됩니다.</p>
        <p class="dialog__error" id="authError" role="alert" hidden></p>
        <div class="dialog__actions">
          <button class="btn" type="button" data-close>취소</button>
          <button class="btn btn--primary" type="button" id="googleBtn">Google로 로그인</button>
        </div>
      </div>

      <div id="logoutPanel" hidden>
        <h2 class="dialog__title">관리자 모드 사용 중</h2>
        <p class="dialog__desc">일반 모드로 돌아가면 수정 기능이 모두 잠깁니다.</p>
        <div class="dialog__actions">
          <button class="btn" type="button" data-close>닫기</button>
          <button class="btn btn--primary" type="button" id="logoutBtn">일반 모드로 전환</button>
        </div>
      </div>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
